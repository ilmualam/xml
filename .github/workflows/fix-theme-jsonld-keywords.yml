name: Fix Theme JSON-LD Keywords

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate label loop diagnostics
        run: node scripts/fix-theme-jsonld-keywords.js asset/xml/ilmualam.xml
      - name: Verify diagnostic files exist
        run: |
          test -s reports/theme-jsonld-fix/label-loops.json
          test -s reports/theme-jsonld-fix/report.json
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilmualam-jsonld-loop-diagnostic
          path: reports/theme-jsonld-fix/
          if-no-files-found: error
          retention-days: 30
