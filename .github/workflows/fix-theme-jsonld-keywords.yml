name: Fix Theme JSON-LD Keywords

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate fixed XML
        run: node scripts/fix-theme-jsonld-keywords.js asset/xml/ilmualam.xml reports/theme-jsonld-fix/ilmualam-fixed.xml
      - name: Verify generated files
        run: |
          test -s reports/theme-jsonld-fix/ilmualam-fixed.xml
          test -s reports/theme-jsonld-fix/report.json
      - name: Upload fixed theme XML
        uses: actions/upload-artifact@v4
        with:
          name: ilmualam-fixed-theme-xml
          path: reports/theme-jsonld-fix/
          if-no-files-found: error
          retention-days: 30
